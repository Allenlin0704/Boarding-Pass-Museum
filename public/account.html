<!DOCTYPE html>
<html lang="zh-CN">

<head>
<script src="security.js?v=4"></script>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>账户设置 - BoardingPassMuseum</title>

<link rel="stylesheet" href="style.css">

    <script src="theme.js"></script>
</head>


<body>


<header class="menubar">

<nav>

</nav>

</header>



<main class="account-page">


<h1>
账户设置
</h1>


<section class="account-card">

<h2>
基本信息
</h2>


<label>
用户名
</label>

<input id="usernameInput">


<label>
邮箱
</label>

<input id="emailInput">


<button id="saveInfo">
保存修改
</button>


</section>

<section class="account-card account-data-card">

<h2>我的数据</h2>

<p>下载一份仅包含你本人资料、投稿、社区记录、等级与通知的 JSON 文件。文件不包含密码、登录凭据或验证码。</p>

<button id="exportData" type="button">下载我的数据</button>

</section>

<section class="account-card account-danger-card">

<h2>注销账户</h2>

<p>注销申请不会立刻删除任何资料。提交后有 48 小时冷静期，可随时取消；到期后账户资料和登录凭据会被匿名化，已公开展品会保留并显示“账号已注销”。提交前请先下载数据副本。</p>

<p id="deletionRequestStatus" role="status">正在检查注销申请状态…</p>

<label for="deletionReason">申请说明（可选）</label>
<textarea id="deletionReason" maxlength="500" placeholder="例如：不再使用此账户"></textarea>

<label for="deletionPassword">当前密码</label>
<input id="deletionPassword" type="password" autocomplete="current-password" placeholder="提交申请时需要确认">

<button id="requestDeletion" class="account-danger-button" type="button">提交注销申请</button>
<button id="cancelDeletion" type="button" hidden>取消注销申请</button>

</section>




<section class="account-card">

<h2>
修改邮箱
</h2>

<label>
新邮箱
</label>

<input id="newEmail">


<button id="sendEmailCode">
发送验证码
</button>


<label>
验证码
</label>

<input id="emailCode">


<label>
当前密码
</label>

<div class="password-wrap">

<input
type="password"
id="emailPassword"
>

<button
class="password-toggle"
data-password="emailPassword"
>
👁
</button>

</div>


<button id="changeEmail">
修改邮箱
</button>


</section>



<section class="account-card">


<h2>
隐私设置
</h2>


<label>

<input 
type="checkbox"
id="publicFavorites"
>

公开我的收藏

</label>


<button id="savePrivacy">

保存设置

</button>


</section>


</main>





<section class="account-card">

<h2>
航空收藏家档案
</h2>


<label>
头像
</label>

<div class="avatar-editor">

<div class="avatar-preview-wrap">
<canvas
id="avatarCanvas"
width="300"
height="300"
></canvas>
</div>

<img
id="profileAvatarPreview"
src="logo.png"
class="profile-avatar"
>

<label class="avatar-button">
更换头像
<input
type="file"
id="avatarFile"
accept="image/*"
hidden
>
</label>

<p class="avatar-hint">
支持 JPG、PNG、WEBP，头像会自动裁切为正方形
</p>

</div>

<input
id="profileAvatarInput"
type="hidden"
>



<label>
个人简介
</label>

<textarea
id="profileBioInput"
placeholder="介绍一下自己喜欢航空的原因">
</textarea>


<label>
社交媒体
</label>

<textarea
id="profileSocialInput"
placeholder="B站 / 微博 / Instagram 等">
</textarea>


<label>
使用设备
</label>

<textarea
id="profileEquipmentInput"
placeholder="例如 iPhone 15 Pro, Sony A7C...">
</textarea>


<label>
喜欢的航空公司
</label>

<div class="profile-selector" id="airlineSelector">

    <div class="profile-selected" id="selectedAirlines"></div>

    <input
    id="profileAirlinesSearch"
    class="profile-selector-input"
    placeholder="搜索航空公司名称 / IATA / ICAO..."
    autocomplete="off"
    >

    <div
    id="airlineResults"
    class="profile-selector-results">
    </div>

</div>

<input
type="hidden"
id="profileAirlinesInput"
>


<label>
喜欢的机场
</label>

<div class="profile-selector" id="airportSelector">

    <div class="profile-selected" id="selectedAirports"></div>

    <input
    id="profileAirportsSearch"
    class="profile-selector-input"
    placeholder="搜索机场名称 / IATA / ICAO..."
    autocomplete="off"
    >

    <div
    id="airportResults"
    class="profile-selector-results">
    </div>

</div>

<input
type="hidden"
id="profileAirportsInput"
>


<button id="saveProfile">
保存航空档案
</button>


</section>


<section class="account-card">

<h2>
修改密码
</h2>


<button id="sendPasswordCode">
发送验证码到当前邮箱
</button>


<label>
验证码
</label>

<input id="passwordCode">


<label>
新密码
</label>

<div class="password-wrap">

<input
type="password"
id="newPassword"
>

<button
class="password-toggle"
data-password="newPassword"
>
👁
</button>

</div>


<label>
确认新密码
</label>

<div class="password-wrap">

<input
type="password"
id="confirmPassword"
>

<button
class="password-toggle"
data-password="confirmPassword"
>
👁
</button>

</div>


<button id="changePassword">
修改密码
</button>


</section>



<script src="auth.js?v=20260912"></script>

<script src="password-toggle.js"></script>

<script src="account.js?v=20260913"></script>


</body>

</html>
