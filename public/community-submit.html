<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发布社区帖子 · BoardingPassMuseum</title><script src="security.js?v=4"></script><script src="theme.js"></script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="features.css"></head><body><main class="bpm-form-page"><a href="community.html">← 返回社区</a><h1>发布社区帖子</h1><p>分享登机牌收藏、航空旅行与机场见闻。</p><form id="communitySubmitForm"><label for="postTitle">标题</label><input id="postTitle" maxlength="100" required><label for="postContent">正文</label><textarea id="postContent" rows="10" maxlength="5000" required></textarea><label for="postImage">图片（可选）</label><input type="file" id="postImage" accept="image/jpeg,image/png,image/webp"><p>上传前请遮挡姓名、票号和其他隐私信息。图片不超过 10 MB。</p><button type="submit" id="publishPost">阅读条例并发布</button><p id="postMessage" role="status" class="bpm-error"></p></form></main><dialog class="bpm-dialog" id="communityRules"><h2>社区条例</h2><div class="bpm-rule-text" id="communityRulesText">正在加载条例…</div><p><a href="community-rules.html" target="_blank" rel="noopener">阅读完整等级、成就及社区条例</a></p><button id="cancelPublish" type="button">返回修改</button><button id="acceptPublish" type="button">同意条例并发布</button></dialog><script src="community-submit.js"></script></body></html>
