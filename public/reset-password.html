<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
重置密码 - BoardingPassMuseum
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="menubar">

<div class="brand">
✈ BoardingPassMuseum
</div>

<nav>

<a href="index.html">
展厅
</a>

<a href="login.html">
登录
</a>

<a href="register.html">
注册
</a>

</nav>

</header>



<section class="container">


<h1>
重置密码
</h1>


<input
id="resetEmail"
placeholder="邮箱"
>


<button id="sendCodeBtn">
发送验证码
</button>


<input
id="resetCode"
placeholder="验证码"
>


<div class="password-wrap">

<input
id="newPassword"
type="password"
placeholder="新密码"
>

<button
type="button"
class="password-toggle"
data-password="newPassword"
aria-label="显示密码"
>👁</button>

</div>


<button id="resetBtn">
重置密码
</button>


<p id="message"></p>


</section>



<script src="reset-password.js"></script>


<script src="password-toggle.js"></script>
</body>

</html>
