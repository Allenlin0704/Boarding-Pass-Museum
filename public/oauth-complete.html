<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css"><script src="theme.js"></script><title>登录处理中 | BoardingPassMuseum</title></head><body><main><section class="submit-form"><h1>正在完成登录</h1><p id="oauthStatus" role="status">请稍候…</p><a href="login.html">返回登录</a></section></main><script>(()=>{const status=document.getElementById('oauthStatus'),error=new URLSearchParams(location.search).get('error');if(error){status.textContent=error;return;}fetch('https://api.bpmuseum.org.cn/api/session',{credentials:'include'}).then(async response=>{const data=await response.json();if(!response.ok)throw Error(data.error||'登录未完成');localStorage.setItem('currentUser',JSON.stringify(data));location.replace('index.html');}).catch(reason=>status.textContent=reason.message||'登录未完成，请重试');})();</script></body></html>
