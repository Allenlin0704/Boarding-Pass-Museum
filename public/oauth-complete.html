<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.png"><link rel="stylesheet" href="style.css?v=20261024-focus-animation"><script src="theme.js?v=20261024-share-default"></script><title>登录处理中 | BoardingPassMuseum</title>  <link rel="stylesheet" href="site-polish.css?v=20261011-admin-client-notice">
</head><body><main><section class="submit-form"><h1>正在完成登录</h1><p id="oauthStatus" role="status">请稍候…</p><a href="login.html">返回登录</a></section></main><dialog id="adminClientNotice" class="admin-client-notice"><form method="dialog"><h2 data-i18n="此站为用户客户端">此站为用户客户端</h2><p data-i18n="管理员与 SA 请前往管理员专属站登录和处理工作。">管理员与 SA 请前往管理员专属站登录和处理工作。</p><div><button type="submit" class="secondary-button" data-i18n="留在客户端">留在客户端</button><a class="button" href="https://admin.bpmuseum.org.cn/admin-login.html" data-i18n="前往管理员端">前往管理员端</a></div></form></dialog><script>(()=>{const status=document.getElementById('oauthStatus'),error=new URLSearchParams(location.search).get('error');if(error){status.textContent=error;return;}fetch('https://api.bpmuseum.org.cn/api/session',{credentials:'include'}).then(async response=>{const data=await response.json();if(!response.ok)throw Error(data.error||'登录未完成');if(['administrator','superadministrator'].includes(data.role)){status.textContent=window.bpmLocaleText?.('此站为用户客户端')||'检测到管理员账号';document.getElementById('adminClientNotice').showModal();return;}localStorage.setItem('currentUser',JSON.stringify(data));location.replace('index.html');}).catch(reason=>status.textContent=reason.message||'登录未完成，请重试');})();</script></body></html>
