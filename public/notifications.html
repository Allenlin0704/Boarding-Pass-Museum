<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知与申诉 · BoardingPassMuseum</title><link rel="icon" type="image/png" href="favicon.png"><script src="security.js?v=4"></script><link rel="stylesheet" href="style.css?v=20260930-site-photos"><link rel="stylesheet" href="features.css?v=20260930-site-photos"><script src="theme.js?v=20260930-site-photos"></script></head>
<body><header class="menubar"><div class="brand"><span data-bpm-icon="plane"></span> BoardingPassMuseum</div><nav><a href="index.html">展厅</a><a href="login.html">登录</a></nav></header><main class="bpm-form-page bpm-notice-page"><a class="bpm-back-link" href="index.html">← 返回展厅</a><section class="bpm-page-hero"><span>账户中心</span><h1>通知与申诉</h1><p>查看社区处理通知、提交申诉并追踪复审进度。</p></section><section class="bpm-info-callout"><strong>申诉说明</strong><p>收到处理通知后，可在 7 个工作日内申诉。SA 会在 14 个工作日内复审；复审期间原决定继续有效。</p></section><section id="sitePhotoInvitationsSection" hidden><div class="bpm-section-heading"><div><span>管理员工作</span><h2>主页照片征集邀请</h2></div></div><p>只有受邀管理员可以提交照片；每张照片会先由 SA 审核。</p><div id="sitePhotoInvitations" class="bpm-list-grid"></div></section><section><div class="bpm-section-heading"><div><span>最新动态</span><h2>通知</h2></div></div><div id="notifications" class="bpm-list-grid"></div></section><section><div class="bpm-section-heading"><div><span>社区条例</span><h2>处理记录</h2></div></div><div id="actions" class="bpm-list-grid"></div></section><section><div class="bpm-section-heading"><div><span>进度追踪</span><h2>我的申诉</h2></div></div><div id="appeals" class="bpm-list-grid"></div></section></main><dialog id="appealDialog" class="bpm-dialog"><form id="appealForm"><h2>提交申诉</h2><p>请清楚说明你认为原处理应当复审的原因。</p><label>申诉理由<textarea name="reason" rows="5" required maxlength="2000"></textarea></label><p id="appealError" class="bpm-error" role="status"></p><div class="bpm-dialog-actions"><button type="button" value="cancel">取消</button><button type="submit">提交申诉</button></div></form></dialog><dialog id="sitePhotoUploadDialog" class="bpm-dialog site-photo-upload-dialog"><form id="sitePhotoUploadForm"><h2>提交主页照片</h2><p>上传照片并填写清楚署名，SA 审核通过后才会加入轮播。</p><label>照片<input type="file" name="image" accept="image/jpeg,image/png,image/webp" required></label><label>照片署名<input type="text" name="credit" maxlength="100" placeholder="例如：摄影者姓名或账号" required></label><fieldset><legend>希望展示的位置</legend><label><input type="checkbox" name="show_home" checked> 首页</label><label><input type="checkbox" name="show_login" checked> 登录页</label><label><input type="checkbox" name="show_register" checked> 注册页</label></fieldset><label class="site-photo-license"><input type="checkbox" name="license_confirmed" value="1" required> 我确认拥有此照片版权或已获权利人授权，并同意 BoardingPassMuseum 按所选位置展示、为页面适配而裁切图片，并按我填写的署名公开展示。我已取得照片中可识别人物所需的许可；如授权或隐私许可有问题，我会联系站主。</label><p id="sitePhotoUploadStatus" role="status"></p><div class="bpm-dialog-actions"><button type="button" id="cancelSitePhotoUpload">取消</button><button type="submit" id="submitSitePhoto">提交 SA 审核</button></div></form></dialog><script src="auth.js?v=20260930-nav-fix"></script><script src="notifications.js?v=20260930-site-photos"></script></body></html>
