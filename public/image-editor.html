<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>图片处理 · BoardingPassMuseum</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css?v=20260927-mobile1">
<link rel="stylesheet" href="features.css?v=20260927-mobile1">
<script src="theme.js?v=20260927-baggage1"></script>
<script src="security.js?v=4"></script>
<style>
.image-editor-page{min-height:100dvh;padding:12px;box-sizing:border-box}.image-editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 12px;max-width:1320px}.image-editor-head h1{font-size:20px}.image-editor-grid{max-width:1320px;margin:auto;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,.7fr);gap:20px}.image-editor-stage{display:grid;place-items:center;min-height:55vh;padding:12px;overflow:auto;background:#081726;border-radius:18px}.image-editor-stage canvas{display:block;max-width:100%;max-height:70vh;object-fit:contain}.image-editor-controls{max-height:calc(100dvh - 90px);overflow:auto;padding:18px;background:var(--bpm-card);border:1px solid var(--bpm-border);border-radius:18px}.image-editor-controls label{display:block;margin:14px 0 6px}.image-editor-controls .watermark-fixed-preview{margin:8px 0;padding:12px;border:1px solid var(--bpm-border);border-radius:10px;background:#003c6b;color:#fff;font-weight:650;letter-spacing:.02em}.image-editor-controls input,.image-editor-controls select{width:100%;min-height:42px}.image-editor-controls button{min-height:42px;margin:4px}.image-editor-finalize{position:sticky;bottom:0;width:100%;padding:12px;background:var(--bpm-card)}@media(max-width:700px){.image-editor-page{padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}.image-editor-head{position:sticky;top:0;z-index:3;padding:6px 4px;background:var(--bpm-bg)}.image-editor-grid{grid-template-columns:1fr;gap:8px}.image-editor-stage{min-height:34dvh;height:34dvh}.image-editor-stage canvas{max-height:32dvh}.image-editor-controls{max-height:none;padding:14px}.image-editor-finalize{position:sticky;bottom:0}.open-image-editor{display:inline-flex}}
</style>
</head>
<body>
<main class="image-editor-page">
<header class="image-editor-head"><a href="submit.html">← 返回投稿</a><h1>图片处理</h1><span>BoardingPassMuseum</span></header>
<div class="image-editor-grid">
<section class="image-editor-stage"><input id="ticketImage" type="file" accept="image/*" hidden><canvas id="watermarkCanvas"></canvas></section>
<section class="image-editor-controls">
<label for="imageScale">缩放与取景</label><input id="imageScale" type="range" min="0.5" max="2" step="0.05" value="1"><p>拖动图片调整取景，或框选裁剪区域。</p>
<div class="privacy-mask-controls"><button id="cropModeBtn" type="button">框选裁剪区域</button><button id="applyCropBtn" type="button" disabled>应用裁剪</button><button id="cancelCropBtn" type="button" disabled>取消</button></div>
<label for="cropAspect">裁剪比例</label><select id="cropAspect"><option value="free">自由</option><option value="1">1:1</option><option value="1.333333">4:3</option><option value="1.777778">16:9</option></select>
<div class="privacy-mask-controls"><button id="rotateImageLeft" type="button"><span data-bpm-icon="rotateLeft"></span> 逆时针旋转</button><button id="rotateImageRight" type="button"><span data-bpm-icon="rotateRight"></span> 顺时针旋转</button></div>
<h2>隐私遮挡</h2><label for="maskColor">实色遮挡</label><select id="maskColor"><option value="#000000">纯黑</option><option value="#ffffff">纯白</option></select>
<div class="privacy-mask-controls"><button id="maskModeBtn" type="button">开始遮挡</button><button id="undoMaskBtn" type="button">撤销上一个</button><button id="clearMasksBtn" type="button">清除遮挡</button></div><p id="maskStatus" role="status">图片移动模式</p>
<h2>水印</h2><p class="watermark-fixed-preview">固定水印 · BoardingPassMuseum</p><label for="watermarkSize">字体大小</label><input id="watermarkSize" type="range" min="10" max="120" value="40"><label for="watermarkPosition">位置</label><select id="watermarkPosition"><option value="bottom-right">右下角</option><option value="bottom-left">左下角</option><option value="top-right">右上角</option><option value="top-left">左上角</option></select>
<div class="image-editor-finalize"><button type="button" id="applyImageEditorResult">完成并返回投稿</button></div>
</section></div>
</main>
<script src="watermark.js?v=20260927-fixed3"></script>
<script src="image-editor.js?v=20260927-watermark2"></script>
</body></html>
