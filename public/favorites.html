<h1>
我的收藏
</h1>

<section class="favorite-organizer" aria-label="收藏整理">
  <div class="favorite-filters">
    <label><span>搜索收藏</span><input id="favoriteSearch" type="search" placeholder="航班、航司、机场或日期"></label>
    <label><span>票种</span><select id="favoriteType"><option value="">全部票种</option><option value="boarding_pass">登机牌</option><option value="rail_ticket">火车票</option><option value="metro_ticket">地铁票</option></select></label>
    <label><span>年份</span><select id="favoriteYear"><option value="">全部年份</option></select></label>
    <label><span>排序</span><select id="favoriteSort"><option value="flight_desc">出行日期（新到旧）</option><option value="flight_asc">出行日期（旧到新）</option><option value="saved_desc">最近收藏</option></select></label>
  </div>
  <div class="favorite-bulk-toolbar">
    <label><input type="checkbox" id="favoriteSelectAll"> 选择当前结果</label>
    <span id="favoriteSelectionCount" aria-live="polite">已选择 0 件</span>
    <button type="button" id="favoriteBulkRemove" disabled>批量移出收藏</button>
  </div>
  <p id="favoriteStatus" role="status" aria-live="polite"></p>
</section>


<div id="favoriteList" class="museum-grid">

</div>
