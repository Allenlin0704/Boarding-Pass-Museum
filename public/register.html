<!DOCTYPE html>
<html lang="zh-CN">

<head>

<link rel="icon" type="image/png" href="favicon.png">

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>注册 | BoardingPassMuseum</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header class="menubar">


<div class="brand">
✈ BoardingPassMuseum
</div>


<nav>

<a href="index.html">
展厅
</a>


<a href="login.html">
登录
</a>

</nav>


</header>





<main>


<section class="submit-form">


<h1>
创建账号
</h1>



<input
id="username"
placeholder="用户名"
>



<div class="verify-box">


<input
id="email"
placeholder="邮箱"
type="email"
>



<button
id="sendCodeBtn"
type="button"
>
获取验证码
</button>


</div>





<input
id="verifyCode"
placeholder="邮箱验证码"
>





<input
id="password"
type="password"
placeholder="密码"
>



<input
id="confirmPassword"
type="password"
placeholder="确认密码"
>




<button
id="registerBtn"
>
注册
</button>



</section>


</main>





<script src="register.js"></script>


</body>

</html>
