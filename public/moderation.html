<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社区管理 · BoardingPassMuseum</title><script src="security.js?v=2"></script><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="features.css"><script src="theme.js"></script></head><body><main class="bpm-form-page"><a href="sa.html">← 返回 SA 工作台</a><h1>社区管理</h1><p><a href="community-rules.html">等级、成就与社区条例</a></p><form id="moderationForm"><h2>处理帖子或评论</h2><label>类型<select name="target_type"><option value="post">帖子</option><option value="comment">评论</option></select></label><label>内容 ID<input name="target_id" type="number" min="1" required></label><label>操作<select name="status"><option value="hidden">下架并处理</option><option value="visible">恢复展示</option></select></label><label>处理等级<select name="severity"><option value="light">轻度：评论提醒，不处罚</option><option value="moderate">中度：隐藏内容并警告；每3次警告禁言7天</option><option value="heavy">重度：下架、封禁7–30天、扣等级计数50张</option><option value="severe">严重：永久封禁，清空等级和成就</option></select></label><label>重度封禁天数<input type="number" name="days" min="7" max="30" value="7"></label><label>违反条款<input name="clause" placeholder="社区条例三、2（4）"></label><label>理由<textarea name="reason" rows="3"></textarea></label><button>执行处理</button><p id="moderationMessage" role="status"></p></form><h2>待复核内容与帖子</h2><div id="moderationPosts"></div><h2>举报</h2><div id="moderationReports"></div><h2>社区申诉</h2><div id="moderationAppeals"></div></main><script src="moderation.js"></script></body></html>
