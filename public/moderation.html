<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社区管理 · BoardingPassMuseum</title><link rel="icon" type="image/png" href="favicon.png"><script src="security.js?v=4"></script><link rel="stylesheet" href="style.css?v=20260927-mobile1"><link rel="stylesheet" href="features.css?v=20260927-mobile1"><script src="theme.js?v=20260927-baggage1"></script></head>
<body><header class="menubar"><div class="brand"><span data-bpm-icon="plane"></span> BoardingPassMuseum</div><nav><a href="index.html">展厅</a><a href="login.html">登录</a></nav></header><main class="bpm-form-page bpm-moderation-page"><a class="bpm-back-link" href="sa.html">← 返回 SA 工作台</a><section class="bpm-page-hero"><span>SA 工作台</span><h1>社区管理</h1><p>处理待复核内容、举报和申诉。请依据 <a href="community-rules.html">社区条例</a> 做出裁定。</p></section><form id="moderationForm" class="bpm-moderation-form"><div class="bpm-section-heading"><div><span>处理工具</span><h2>执行处理</h2></div></div><div class="bpm-form-grid"><label>内容类型<select name="target_type"><option value="post">帖子</option><option value="comment">评论</option></select></label><label>内容 ID<input name="target_id" type="number" min="1" required placeholder="例如 123"></label><label>展示状态<select name="status"><option value="hidden">下架并处理</option><option value="visible">恢复展示</option></select></label><label>处理等级<select name="severity"><option value="light">轻度：提醒</option><option value="moderate">中度：隐藏并警告</option><option value="heavy">重度：封禁并扣减等级</option><option value="severe">严重：永久封禁</option></select></label><label>重度封禁天数<input type="number" name="days" min="7" max="30" value="7"></label><label>违反条款<input name="clause" placeholder="例如：社区条例三、2（4）"></label></div><label>处理理由<textarea name="reason" rows="4" placeholder="请填写对用户可见的处理依据"></textarea></label><div class="bpm-form-actions"><button type="submit">保存处理决定</button><p id="moderationMessage" role="status"></p></div></form><section><div class="bpm-section-heading"><div><span>优先处理</span><h2>待复核内容与帖子</h2></div></div><div id="moderationPosts" class="bpm-list-grid"></div></section><section><div class="bpm-section-heading"><div><span>用户举报</span><h2>举报队列</h2></div></div><div id="moderationReports" class="bpm-list-grid"></div></section><section><div class="bpm-section-heading"><div><span>复审请求</span><h2>申诉队列</h2></div></div><div id="moderationAppeals" class="bpm-list-grid"></div></section></main><dialog id="decisionDialog" class="bpm-dialog"><form id="decisionForm"><h2 id="decisionTitle">确认处理</h2><label>处理依据或最终裁定<textarea name="reason" rows="5" required maxlength="2000"></textarea></label><p id="decisionError" class="bpm-error" role="status"></p><div class="bpm-dialog-actions"><button type="button" value="cancel">取消</button><button type="submit">确认保存</button></div></form></dialog><script src="auth.js?v=20260927"></script><script src="moderation.js?v=3"></script></body></html>
