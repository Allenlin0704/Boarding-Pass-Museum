name = "boardingpassmuseum-api"
main = "worker/index.js"
compatibility_date = "2026-08-17"
keep_vars = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "boardingpassmuseum-db"
database_id = "df57ffb4-b712-4635-8842-30ef50365841"
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "boardingpassmuseum-images"

[triggers]
# Hourly maintenance, plus Friday 16:00 UTC = Saturday 00:00 Beijing.
crons = ["0 * * * *", "0 16 * * 5"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1.0
invocation_logs = false
persist = true

[observability.traces]
enabled = false

[vars]
TURNSTILE_HOSTNAMES = "bpmuseum.org.cn,www.bpmuseum.org.cn,admin.bpmuseum.org.cn"
