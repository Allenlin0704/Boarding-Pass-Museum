name: Windows Store package

on:
  push:
    branches:
      - codex/store-msixupload-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build unsigned Store upload package
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          & msbuild windows-app/BoardingPassMuseum/BoardingPassMuseum.csproj `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            '/p:AppxBundlePlatforms=x86|x64|ARM64' `
            /p:AppxBundle=Always `
            /p:UapAppxPackageBuildMode=StoreUpload `
            "/p:AppxPackageDir=$packageDir\" `
            /p:AppxPackageSigningEnabled=false `
            /p:GenerateAppxPackageOnBuild=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Store package artifact
        uses: actions/upload-artifact@v4
        with:
          name: boardingpassmuseum-store-upload
          path: artifacts/**/*.msixupload
          if-no-files-found: error
          retention-days: 3
